# Релизные сборки «Ментора» под Windows, Linux и macOS.
# Запускается пушем тега v*.*.*; артефакты прикрепляются к GitHub Release
# этого же тега. Android и Aurora собираются локально и догружаются вручную.
#
# Qt 6.7.3 ставится напрямую 7z-архивами с зеркала ftp.fau.de: pypi-пакет aqt
# в новых версиях не понимает XML старого архива 6.7.3, а старые версии aqt
# не понимают новую структуру каталогов зеркала.
name: Release builds

on:
  push:
    tags:
      - "v*.*.*"
  # Ручной запуск для проверки сборок без тега (артефакты — в CI, не в релиз).
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_BASE_URL: https://ftp.fau.de/qtproject/online/qtsdkrepository

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Автоверсия берётся из git describe — нужны теги в истории.
          fetch-depth: 0

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Установка Qt 6.7.3 (base + QtPdf)
        shell: bash
        run: |
          mkdir -p ~/qt673 && cd ~/qt673
          D="$QT_BASE_URL/windows_x86/desktop/qt6_673"
          PKGS="$D/qt.qt6.673.win64_msvc2019_64 $D/qt.qt6.673.addons.qtpdf.win64_msvc2019_64"
          for p in $PKGS; do
            for u in $(curl -s "$p/" | grep -oE '"[^"]*\.7z"' | tr -d '"' | grep -v meta); do
              curl -fsSL --retry 3 -O "$p/$u"
            done
          done
          for a in *.7z; do 7z x -y -o"$HOME/qt673/Qt" "$a" >/dev/null; done
          QD="$HOME/qt673/Qt/6.7.3/msvc2019_64"
          echo "Qt6_DIR=$QD" >> "$GITHUB_ENV"
          echo "QT_DIR=$QD" >> "$GITHUB_ENV"
          echo "$QD/bin" >> "$GITHUB_PATH"
          "$QD/bin/qmake.exe" -query | head -2

      - name: Сборка
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$Qt6_DIR"
          cmake --build build

      - name: Упаковка (windeployqt + zip)
        shell: bash
        run: |
          VER=$(git describe --tags --match "v[0-9]*" | sed 's/^v//')
          "$QT_DIR/bin/windeployqt.exe" --release --qmldir qml build/ru.Mentor.exe
          mkdir -p dist/ru.Mentor
          cp build/ru.Mentor.exe dist/ru.Mentor/
          cp build/*.dll dist/ru.Mentor/ 2>/dev/null || true
          for d in platforms qml imageformats sqldrivers styles networkinformation \
                   tls iconengines translations; do
            [ -d "build/$d" ] && cp -a "build/$d" "dist/ru.Mentor/"
          done
          ( cd dist/ru.Mentor && 7z a -tzip "../../ru.Mentor-${VER}-win64.zip" . )

      - name: Загрузка артефакта в релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ru.Mentor-*-win64.zip

      - name: Артефакт CI (ручной запуск без тега)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: win64
          path: ru.Mentor-*-win64.zip

  linux:
    runs-on: ubuntu-22.04
    env:
      LINUXDEPLOY: ${{ github.workspace }}/tools/linuxdeploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Автоверсия берётся из git describe — нужны теги в истории.
          fetch-depth: 0

      - name: Системные пакеты
        run: sudo apt-get update && sudo apt-get install -y patchelf p7zip-full libegl-dev libgl-dev libglx-dev libglu1-mesa-dev libxkbcommon-dev libvulkan-dev libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libxcb-util1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Установка Qt 6.7.3 (base + QtPdf)
        run: |
          mkdir -p ~/qt673 && cd ~/qt673
          D="$QT_BASE_URL/linux_x64/desktop/qt6_673"
          PKGS="$D/qt.qt6.673.linux_gcc_64 $D/qt.qt6.673.addons.qtpdf.linux_gcc_64"
          for p in $PKGS; do
            for u in $(curl -s "$p/" | grep -oE '"[^"]*\.7z"' | tr -d '"' | grep -v meta); do
              curl -fsSL --retry 3 -O "$p/$u"
            done
          done
          for a in *.7z; do 7z x -y -o"$HOME/qt673/Qt" "$a" >/dev/null; done
          QD="$HOME/qt673/Qt/6.7.3/gcc_64"
          # 7z не восстанавливает бит исполнения.
          chmod -R +x "$QD/bin" "$QD/libexec" "$QD/plugins"
          echo "Qt6_DIR=$QD" >> "$GITHUB_ENV"
          echo "QT_DIR=$QD" >> "$GITHUB_ENV"
          echo "$QD/bin" >> "$GITHUB_PATH"
          "$QD/bin/qmake" -query | head -2

      - name: linuxdeploy
        run: |
          mkdir -p tools
          curl -fsSL -o "$LINUXDEPLOY" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x "$LINUXDEPLOY"
          "$LINUXDEPLOY" --appimage-extract >/dev/null
          if [ -x squashfs-root/usr/bin/patchelf ]; then
              echo "PATCHELF=$PWD/squashfs-root/usr/bin/patchelf" >> "$GITHUB_ENV"
          else
              echo "PATCHELF=patchelf" >> "$GITHUB_ENV"
          fi

      - name: Сборка
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$Qt6_DIR"
          cmake --build build

      - name: AppImage
        run: |
          bash packaging/make_appimage.sh build "${RUNNER_TEMP}/out"
          cp "${RUNNER_TEMP}"/out/*.AppImage "$GITHUB_WORKSPACE"/

      - name: Загрузка артефакта в релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.AppImage"

      - name: Артефакт CI (ручной запуск без тега)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: "*.AppImage"

  # macOS: архивы Qt на зеркале универсальные (X86_64+ARM64), собираем тем же
  # способом, что Windows/Linux. macdeployqt вместо windeployqt/linuxdeploy.
  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Автоверсия берётся из git describe — нужны теги в истории.
          fetch-depth: 0

      - name: Установка Qt 6.7.3 (base + QtPdf)
        run: |
          command -v 7z >/dev/null || brew install p7zip
          mkdir -p ~/qt673 && cd ~/qt673
          D="$QT_BASE_URL/mac_x64/desktop/qt6_673"
          PKGS="$D/qt.qt6.673.clang_64 $D/qt.qt6.673.addons.qtpdf.clang_64"
          for p in $PKGS; do
            for u in $(curl -s "$p/" | grep -oE '"[^"]*\.7z"' | tr -d '"' | grep -v meta); do
              curl -fsSL --retry 3 -O "$p/$u"
            done
          done
          for a in *.7z; do 7z x -y -o"$HOME/qt673/Qt" "$a" >/dev/null; done
          # Каталог Qt на macOS называется macos — определяем по расположению qmake.
          QD="$(cd "$(dirname "$(find "$HOME/qt673/Qt" -maxdepth 4 -name qmake | head -1)")/.." && pwd)"
          echo "Qt6_DIR=$QD" >> "$GITHUB_ENV"
          echo "QT_DIR=$QD" >> "$GITHUB_ENV"
          echo "$QD/bin" >> "$GITHUB_PATH"
          "$QD/bin/qmake" -query | head -2

      - name: Сборка (arm64 + x86_64)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$Qt6_DIR" \
                -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build

      - name: Упаковка (macdeployqt + zip)
        run: |
          VER=$(git describe --tags --match "v[0-9]*" | sed 's/^v//')
          "$QT_DIR/bin/macdeployqt" "build/ru.Mentor.app" -qmldir=qml
          # Ad-hoc подпись: без неё на Apple Silicon систему убивает неподписанные бинари.
          codesign --force --deep --sign - "build/ru.Mentor.app"
          ditto -c -k --keepParent "build/ru.Mentor.app" "ru.Mentor-${VER}-macos.zip"

      - name: Загрузка артефакта в релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ru.Mentor-*-macos.zip

      - name: Артефакт CI (ручной запуск без тега)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: ru.Mentor-*-macos.zip
