# Project-wide Gradle settings.
# Локальная переопределённая копия шаблона Qt
# (src/3rdparty/gradle/gradle.properties): androiddeployqt кладёт файлы из
# android/ проекта поверх шаблона.
# Увеличен heap Gradle: защищённый бандл MENTOR_DATA_ENCRYPTED содержит asset
# dannie.tar.enc ~553 МБ - со стандартными 2500m compressReleaseAssets падает
# (Java heap space).
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable building projects in parallel
org.gradle.parallel=true

# Allow AndroidX usage
android.useAndroidX=true
